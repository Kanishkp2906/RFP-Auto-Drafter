services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8008:8008"
    env_file:
      - .env
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    command: rq worker --with-scheduler
    restart: unless-stopped
