services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8008:8008"
    env_file:
      - .env
    volumes:
      - uploaded_docs:/app/uploaded_docs
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    command: rq worker --with-scheduler
    volumes:
      - uploaded_docs:/app/uploaded_docs
    restart: unless-stopped

volumes:
  uploaded_docs
